name: 'Casa (diopsys)'
description: 'Tunet von gorbi87 plus eigene, noch nicht gemergte Änderungen (Zweig casa)'
version: "1.31.7-casa.10"
slug: 'casa'
url: 'https://github.com/diopsys/Tunet/tree/casa'
init: false
startup: application
arch:
  - aarch64
  - amd64
homeassistant_api: true
# Wartung: Portainer starten/stoppen für das Leeren des Docker-Build-Caches
hassio_api: true
hassio_role: manager
auth_api: true
ingress: true
ingress_port: 3002
panel_icon: 'mdi:view-dashboard-variant'
panel_title: 'Tunet'
# Seitenleisten-Eintrag auch für Nicht-Admins (Familie); Einstellungen bleiben per PIN/Rechten geschützt
panel_admin: false
ports:
  3002/tcp: null
ports_description:
  3002/tcp: 'Tunet Web Interface (not needed when using Ingress)'
options:
  ma_url: ''
  ma_token: ''
  caldav_url: ''
  caldav_user: ''
  caldav_password: ''
  ha_url: ''
  ha_token: ''
  data_encryption_mode: 'off'
  data_encryption_key: ''
  data_encryption_salt: ''
schema:
  ma_url: 'str?'
  ma_token: 'password?'
  caldav_url: 'str?'
  caldav_user: 'str?'
  caldav_password: 'password?'
  ha_url: 'str?'
  ha_token: 'password?'
  data_encryption_mode: 'list(off|dual|enc_only)?'
  data_encryption_key: 'password?'
  data_encryption_salt: 'password?'
